# Configuration for simple FEA cantilever optimization
max_iterations: 100 # Increased iterations
checkpoint_interval: 1 #MN: was 10
log_level: "INFO"

# LLM configuration
llm:
  primary_model: "claude-sonnet-4-5-20250929"
  primary_model_weight: 0.8
  secondary_model: "claude-opus-4-5-20251101"
  secondary_model_weight: 0.2
  api_base: "https://api.anthropic.com"
  api_key: "${ANTHROPIC_API_KEY}"
  temperature: 0.7
  max_tokens: 8192
  timeout: 600

# Prompt configuration --> update prompts for FEA task
prompt:
  system_message: |
    You are an expert in structural mechanics and finite element analysis using the PyNiteFEA library.
    Your task is to improve a simple cantilever beam geometry for FEA, where the evaluator minimizes
    the maximum nodal displacement under a fixed vertical tip load.

    Code structure:
    - The evolvable code lives inside an EVOLVE-BLOCK in `initial_program.py`.
    - That file defines a function `construct_geometry()` which:
        - Creates two nodes: N1 at (0.0, 0.0, 0.0) and N2 at (SECOND_NODE_X, 0.0, 0.0).
        - Writes these coordinates to `input.csv` (or `nodes.csv`), which the evaluator uses to build
          a PyNite `FEModel3D` cantilever.
    - The evaluator:
        - Builds a beam with A36 material and W-section properties, fixes N1, and applies a downward
          vertical load at N2.
        - Runs a linear FEA analysis and computes fitness as the negative of the maximum nodal
          displacement magnitude (smaller displacement → higher fitness).

    Critical constraint:
    - There is exactly ONE degree of freedom for the evolutionary process:
        - The x-coordinate of the second node, `SECOND_NODE_X`, which controls the span length.
    - You MUST only change the numeric value of `SECOND_NODE_X` inside the EVOLVE-BLOCK.
    - Do NOT change:
        - Function names or signatures.
        - The number of nodes (must remain exactly 2).
        - The y or z coordinates of any node.
        - Any CSV-writing, evaluator, or PyNite-related code outside the EVOLVE-BLOCK.

    Objective:
    - Propose values of `SECOND_NODE_X` that improve the evaluator’s fitness.
    - Prefer physically realistic spans (positive, finite beam length).
    - Avoid code that introduces new parameters, control flow, or complexity; focus solely on
      setting `SECOND_NODE_X` to a good scalar value.

  num_top_programs: 3
  use_template_stochasticity: true

# Database configuration
database:
  population_size: 60 # Increased population for more diversity
  archive_size: 25
  num_islands: 4
  elite_selection_ratio: 0.3
  exploitation_ratio: 0.7

# Evaluator configuration
evaluator:
  timeout: 60
  cascade_evaluation: true
  cascade_thresholds: [0.5, 0.75]
  parallel_evaluations: 4
  use_llm_feedback: false

# Evolution settings
diff_based_evolution: false # Use full rewrites instead of diffs
allow_full_rewrites: true # Allow full rewrites for constructor functions
