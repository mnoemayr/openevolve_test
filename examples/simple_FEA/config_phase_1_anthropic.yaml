# Configuration for simple FEA
max_iterations: 100 # Increased iterations
checkpoint_interval: 1 #MN: was 10
log_level: "INFO"

# LLM configuration
llm:
  primary_model: "claude-sonnet-4-5-20250929"
  primary_model_weight: 0.8
  secondary_model: "claude-opus-4-5-20251101"
  secondary_model_weight: 0.2
  api_base: "https://api.anthropic.com"
  api_key: "${ANTHROPIC_API_KEY}"
  temperature: 0.7
  max_tokens: 8192
  timeout: 600

# Prompt configuration --> update prompts for FEA task
prompt:
  system_message: |
    You are an expert mathematician specializing in extremal geometry and analytic constructions.
    Your task is to improve a constructor function that directly produces the maximum-area triangle inscribed in a unit circle.

    Key geometric insights:
    - For a fixed circumradius, triangle area is maximized when all sides are equal
    - Equal angular spacing of vertices on the circle maximizes pairwise chord lengths
    - Any deviation from 120° central angles decreases the triangle’s area
    - Rotational symmetry implies a family of equivalent optima rather than a unique solution
    - This extremal configuration admits a closed-form analytic construction
    
    Focus:
    Construct the triangle explicitly by specifying vertex angles or coordinates on the unit circle.
    Avoid iterative solvers, heuristics, or gradient-based methods; rely on geometric structure and exact formulas.

  num_top_programs: 3
  use_template_stochasticity: true

# Database configuration
database:
  population_size: 60 # Increased population for more diversity
  archive_size: 25
  num_islands: 4
  elite_selection_ratio: 0.3
  exploitation_ratio: 0.7

# Evaluator configuration
evaluator:
  timeout: 60
  cascade_evaluation: true
  cascade_thresholds: [0.5, 0.75]
  parallel_evaluations: 4
  use_llm_feedback: false

# Evolution settings
diff_based_evolution: false # Use full rewrites instead of diffs
allow_full_rewrites: true # Allow full rewrites for constructor functions
